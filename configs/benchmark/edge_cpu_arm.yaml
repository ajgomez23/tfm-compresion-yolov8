# Perfil declarado pero no ejecutado, por falta de hardware.
device_id: edge_cpu_arm
description: >-
  Dispositivo de borde con CPU ARM, tipo Raspberry Pi 5.
device_type: cpu
valid_for_measurement: true
available: false
unavailable_reason: >-
  No se dispone del dispositivo fisico. La campana registra status=no_disponible
